format = '$username$hostname$directory$git_branch$character'

add_newline = false

[username]
format = '[$user]($style)@'
style_user = 'bold yellow'

[hostname]
format = '[$hostname]($style) '
style = 'bold yellow'
ssh_only = true

[directory]
format = '[$path]($style) '
style = 'bold cyan'
truncation_length = 4
truncate_to_repo = false
read_only = ' ro'

[git_branch]
format = '[git:$branch]($style) '
style = 'bold #cba6f7'

[character]
success_symbol = '[>](bold green)'
error_symbol = '[>](bold red)'
