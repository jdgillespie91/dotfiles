# Prefix
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# General
set-option -g mouse on
set-option -g history-limit 100000
set-option -sg escape-time 10
set-option -g focus-events on
set-option -g default-terminal "tmux-256color"
set-option -as terminal-features ",xterm-ghostty:RGB"
set-option -as terminal-features ",ghostty:RGB"
set-option -s set-clipboard on

set-option -g base-index 1
set-option -g pane-base-index 1
set-option -g renumber-windows on

# Key bindings
unbind %
unbind '"'
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"
bind-key c new-window -c "#{pane_current_path}"
bind-key r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

bind-key s choose-tree -Z -O name

# Copy mode
set-option -g mode-keys vi
bind-key Enter copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Escape send-keys -X cancel

# Theme - Catppuccin Mocha-inspired palette.
set-option -g status on
set-option -g status-interval 1
set-option -g status-position bottom
set-option -g status-justify left
set-option -g status-left-length 40
set-option -g status-right-length 120

set-option -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set-option -g message-style "bg=#313244,fg=#cdd6f4"
set-option -g message-command-style "bg=#313244,fg=#cdd6f4"
set-option -g mode-style "bg=#45475a,fg=#cdd6f4"

set-option -g pane-border-style "fg=#313244"
set-option -g pane-active-border-style "fg=#89b4fa"
set-option -g window-style "bg=#181825,fg=#a6adc8"
set-option -g window-active-style "bg=#1e1e2e,fg=#cdd6f4"

set-option -g window-status-format "#[fg=#585b70,bg=#1e1e2e] #I:#W#{?window_flags,#{window_flags}, } "
set-option -g window-status-current-format "#[fg=#1e1e2e,bg=#89b4fa,bold] #I:#W#{?window_flags,#{window_flags}, } "
set-option -g window-status-separator ""
set-option -g window-status-activity-style "fg=#f9e2af,bg=#1e1e2e"
set-option -g window-status-bell-style "fg=#1e1e2e,bg=#f38ba8,bold"

set-option -g status-left "#[fg=#1e1e2e,bg=#cba6f7,bold] #S #[default] "
set-option -g status-right "#[fg=#a6adc8,bg=#1e1e2e]#{?client_prefix,#[fg=#1e1e2e]#[bg=#f38ba8] PREFIX ,} #[fg=#1e1e2e,bg=#a6e3a1] #{pane_current_command} #[fg=#1e1e2e,bg=#89dceb] %Y-%m-%d #[fg=#1e1e2e,bg=#74c7ec] %H:%M "
